<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">


    <main class="d-flex justify-content-center my-3 py-5 rounded">
        <div class=" bg-white p-5 rounded shadow-sm">
            <h1 class="text-primary fw-bold text-center mb-5" 💌>Formulario de contacto</h1>
            <small class="text-muted">Completa el formulario con tus datos</small>
            <form action="">
                <label class="form-label" for="name">Nombre Completo</label>
                <input class="form-control mb-4" type="text" name="email" id="name"
                    placeholder="Ej:Gonzalo Sanchez-Ros Paz" required>
                <label class="form-label" for="pass">Contraseña</label>
                <input class="form-control mb-4" name="pass" id="pass" placeholder="Ingresa tu contraseña" required>
                <label class="form-label" for="email">Correo Electronico</label>
                <input class="form-control mb-4" name="email" id="email" placeholder="email@email.com" required>
                <label class="form-label" for="asunto"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        fill="currentColor" class="bi bi-file-earmark-text-fill" viewBox="0 0 16 16">
                        <path
                            d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1M4.5 9a.5.5 0 0 1 0-1h7a.5.5 0 0 1 0 1zM4 10.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 1 0-1h4a.5.5 0 0 1 0 1z" />
                    </svg> Asunto</label>
                <input class="form-control mb-4" name="pass" id="asunto" placeholder="Ingresa tu contraseña" required>
                <label class="form-label" for="textarea"><i class="bi bi-chat-left"><svg
                            xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-chat-left" viewBox="0 0 16 16">
                            <path
                                d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4.414A2 2 0 0 0 3 11.586l-2 2V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12.793a.5.5 0 0 0 .854.353l2.853-2.853A1 1 0 0 1 4.414 12H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
                        </svg> Mensaje *</i></label><br>
                <textarea name="textarea" id="textarea" cols="30" rows="10">

                </textarea>

                <div class="d-flex flex-row gap-3 justify-content-around">
                    <button class="btn btn-outline-primary w-100">Boton1</button>
                    <button class="btn btn-outline-secondary w-100">Boton 2</button>
                </div>
            </form>
        </div>
    </main>

    <footer class=" p-4" style="background-color: #3d256a;">
        <h4 class="text-center text-white">2024: Curso de Fundamentos de Programación web</h1>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>



</body>

</html>
