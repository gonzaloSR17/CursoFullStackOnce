<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    

    <main class="d-flex justify-content-center my-5 py-5 rounded">
        <div class=" bg-white p-5 rounded">
            <h1 class="text-primary fw-bold text-center mb-5">Inicar Sesión</h1>
            <form action="">
                <label class="form-label" for="email">Correo Electronico</label>
                <input class="form-control mb-4" name="email" id="email" placeholder="email@email.com" required>
                <label class="form-label" for="pass">Contraseña</label>
                <input class="form-control mb-4" name="pass" id="pass" placeholder="Ingresa tu contraseña" required>
                <div class="justify-content-center d-flex flex-column">
                     <button class="btn btn-primary text-center fs-5 mb-3 py-2">Inciar Sesion</button>
                     <p class="text-center"><strong>Pista:</strong> Usuario: <code>alumno@curso.com</code> | Contraseña: <code>1234</code></p>
                </div>
            </form>
        </div>
    </main>

    <footer class=" p-4" style="background-color: #3d256a;">
        <h4 class="text-center text-white">2024: Curso de Fundamentos de Programación web</h1>
    </footer>

    
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>



</body>
</html>
