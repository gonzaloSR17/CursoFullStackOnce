<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <script>

        function verificarContraseña() {
            const password = document.getElementById('texto_contrasenia').value;

            if (password == 2001) {
                alert("Contraeña Correcta ✅")
            } else {
                alert("Contraseña Incorrecta ❌")
            }

        }

        function introducirNumero(number){
        const input = document.getElementById('texto_contrasenia');
        input.value += number; // Agrega el número al final del valor actual
        }

        function eliminarNumero(){
            const input = document.getElementById('texto_contrasenia');
            input.value = input.value.slice(0, -1); // Borra el último carácter
        }
    </script>

    <div class="container bg-info-subtle border-primary rounded mt-5">
        <div class="row p-4 border-primary">
        <div class="col-12 p-1 mb-5">
            <input class="w-100" type="text" id="texto_contrasenia">
        </div>
        <div class="col-12 p-1">
            <div class="row">
                <div class="col-4">
                     <button type="button" onclick="introducirNumero(1)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">1</button>
                </div>

                <div class="col-4">
                    <button type="button" onclick="introducirNumero(2)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">2</button>
                </div>
  

                <div class="col-4">
                     <button type="button" onclick="introducirNumero(3)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">3</button>
                </div>
           </div>
        </div>
        <div class="col-12 p-1">
            <div class="row">
                <div class="col-4">
                     <button onclick="introducirNumero(4)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">4</button>
                </div>

                <div class="col-4">
                    <button onclick="introducirNumero(5)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">5</button>
                </div>
  

                <div class="col-4">
                     <button onclick="introducirNumero(6)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">6</button>
                </div>
           </div>
        </div>
        <div class="col-12 p-1">
            <div class="row">
                <div class="col-4">
                     <button onclick="introducirNumero(7)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">7</button>
                </div>

                <div class="col-4">
                    <button onclick="introducirNumero(8)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto ">8</button>
                </div>
  

                <div class="col-4">
                     <button onclick="introducirNumero(9)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">9</button>
                </div>
           </div>
        </div>
        <div class="col-12 p-1">
            <div class="row">
                <div class="col-4">
                     <button onclick="verificarContraseña()" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">✔️</button>
                </div>

                <div class="col-4">
                    <button onclick="introducirNumero(0)" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">0</button>
                </div>

                <div class="col-4">
                     <button onclick="eliminarNumero()" class="btn btn-outline-primary btn-lg text-center rounded-circle d-block mx-auto">❌</button>
                </div>
           </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
</body>
</html>
