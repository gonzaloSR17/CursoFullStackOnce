<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        background: linear-gradient(to bottom right, blue, pink);
        background-repeat: no-repeat;
        background-size: cover;
         height: 100vh;
    }
</style>
<body class="my-5">
    

    <div class="container me-5">
        <div class="row">
            <div class="col-4">
                <div class="card rounded shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold">
                        <h2>Lista Pendiente a hacer</h2>
                    </div>
                    <div class="card-body bg-light p-4">
                        <div id="container-list" class="bg-white p-4 container-fluid">
                            Aqui ira la lista....
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-8">
                <div class="card rounded shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold">
                        <h2>Crear una lista...</h2>
                    </div>
                    <div class="card-body bg-light p-4">
                        <form action="">
                            <div class="row">
                                <div class="col-12">
                                    <label for="ntarea" class="form-label">Nombre de Tarea:</label>
                                    <input type="text" id="ntarea" class="form-control" placeholder="Escribe..." required>
                                </div>
                                <div class="col-6">
                                    <label for="nmomento" class="form-label mt-4">Dia y Hora:</label>
                                    <input type="datetime-local" id="nmomento" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label for="ntipo" class="form-label mt-4">Tipo de Tarea:</label> <br>
                                    <select name="ntipo" id="ntipo" class="form-select">
                                        <option value="deporte">Deporte</option>
                                        <option value="estudio">Estudio</option>
                                        <option value="lectura">Lectura</option>
                                        <option value="videojuego">Videojuegos</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <button type="reset" class="btn btn-outline-danger w-100 mt-4">Eliminar</button>
                                </div>
                                <div class="col-6">
                                    <button type="submit" id="btn-submit" class="btn btn-outline-primary w-100 mt-4">Enviar </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <ul class="list-unstyled" ></ul>
    
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
