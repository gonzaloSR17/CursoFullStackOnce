<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty - Galeria de personajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
    }

    header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
        padding: 20px;
    }

    h1 {
        font-size: 3em;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 1.2em;
        opacity: 0.9;
    }

    .loading {
        text-align: center;
        color: white;
        font-size: 1.5em;
        padding: 50px;
    }

    .error {
        background-color: #ff6b6b;
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        margin: 20px auto;
        max-width: 600px;
    }

    .characters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
        padding: 20px 0;
    }

    .character-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
    }

    .character-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    .character-image {
        width: 100%;
        height: 280px;
        object-fit: cover;
        display: block;
    }

    .character-info {
        padding: 20px;
    }

    .character-name {
        font-size: 1.4em;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
    }

    .character-detail {
        display: flex;
        align-items: center;
        margin: 8px 0;
        font-size: 0.95em;
        color: #666;
    }

    .detail-label {
        font-weight: bold;
        margin-right: 5px;
        color: #444;
    }

    .status {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: bold;
        text-transform: uppercase;
    }

    .status.alive {
        background-color: #51cf66;
        color: white;
    }

    .status.dead {
        background-color: #ff6b6b;
        color: white;
    }

    .status.unknown {
        background-color: #868e96;
        color: white;
    }

    .episodes-count {
        margin-top: 12px;
        padding: 10px;
        background-color: #f8f9fa;
        border-radius: 8px;
        text-align: center;
    }

    .episodes-count strong {
        color: #667eea;
        font-size: 1.1em;
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin: 40px 0;
    }

    .pagination button {
        padding: 12px 24px;
        font-size: 1em;
        background-color: white;
        color: #667eea;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .pagination button:hover:not(:disabled) {
        background-color: #667eea;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .pagination button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .page-info {
        color: white;
        font-size: 1.1em;
        font-weight: bold;
    }

    @media (max-width: 768px) {
        h1 {
            font-size: 2em;
        }

        .characters-grid {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
    }
</style>

<body>

    <div class="container">
        <header>
            <h1>👽 Rick and Morty 🧒👴</h1>
            <p class="subtitle">Galería de Personajes del Multiversos</p>
        </header>

        <div id="loading" class="loading">Cargando personajes...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="characters-container" class="characters-grid"></div>

        <div id="pagination" class="pagination" style="display: none;">
            <button id="prev-btn">🢀 Anterior</button>
            <span id="page-info" class="page-info"></span>
            <button id="next-btn">Siguiente 🢂</button>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

    
    

</body>

</html>
