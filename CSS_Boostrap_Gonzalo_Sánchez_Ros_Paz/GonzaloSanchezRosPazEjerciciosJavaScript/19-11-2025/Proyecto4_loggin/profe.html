<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <!-- FORMULARIO DE REGISTRO -->
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h4>Registro de Usuario</h4>
                    </div>
                    <div class="card-body">
                        <form id="formRegistro">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="usuarioRegistro" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="passwordRegistro" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                        </form>
                        <!-- Mensaje de confirmación de registro -->
                        <p id="mensajeRegistro" class="mt-3 alert alert-success d-none"></p>
                    </div>
                </div>

                <!-- FORMULARIO DE LOGIN -->
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4>Iniciar Sesión</h4>
                    </div>
                    <div class="card-body">
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="usuarioLogin" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="passwordLogin" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Iniciar Sesión</button>
                        </form>
                        <!-- Mensaje de error de login (fondo rojo) -->
                        <p id="mensajeError" class="mt-3 p-3 text-white d-none" style="background-color: red;">
                            ❌ Datos incorrectos. Inténtalo de nuevo.
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // ============================================
        // REGISTRO DE USUARIO
        // ============================================
        
        // Obtener el formulario de registro
        const formRegistro = document.getElementById('formRegistro');
        
        // Escuchar el evento submit del formulario de registro
        formRegistro.addEventListener('submit', function(event) {
            event.preventDefault(); // Evitar que se recargue la página
            
            // Obtener los valores ingresados por el usuario
            const usuario = document.getElementById('usuarioRegistro').value;
            const password = document.getElementById('passwordRegistro').value;
            
            // Guardar los datos en localStorage (almacenamiento del navegador)
            // localStorage.setItem('usuario', usuario);
            // localStorage.setItem('password', password);
            
            



            // Mostrar mensaje de confirmación
            const mensajeRegistro = document.getElementById('mensajeRegistro');
            mensajeRegistro.textContent = '✓ Usuario registrado correctamente ' +localStorage.length;
            mensajeRegistro.classList.remove('d-none'); // Mostrar el mensaje
            
            // Limpiar el formulario
            formRegistro.reset();
        });

        // ============================================
        // LOGIN DE USUARIO
        // ============================================
        
        // Obtener el formulario de login
        const formLogin = document.getElementById('formLogin');
        
        // Escuchar el evento submit del formulario de login
        formLogin.addEventListener('submit', function(event) {
            event.preventDefault(); // Evitar que se recargue la página
            
            // Obtener los valores ingresados en el login
            const usuarioIngresado = document.getElementById('usuarioLogin').value;
            const passwordIngresada = document.getElementById('passwordLogin').value;
            
            // Obtener los datos guardados en localStorage
            const usuarioGuardado = localStorage.getItem('usuario');
            const passwordGuardada = localStorage.getItem('password');
            
            // Obtener el elemento del mensaje de error
            const mensajeError = document.getElementById('mensajeError');
            
            // Comparar los datos ingresados con los guardados
            if (usuarioIngresado === usuarioGuardado && passwordIngresada === passwordGuardada) {
                // Si los datos son correctos, redirigir a Google
                window.location.href = 'https://www.google.com';
            } else {
                // Si los datos son incorrectos, mostrar mensaje de error
                mensajeError.classList.remove('d-none'); // Mostrar el párrafo rojo
                
                // Opcional: ocultar el mensaje después de 3 segundos
                setTimeout(function() {
                    mensajeError.classList.add('d-none');
                }, 3000);
            }
        });
    </script>
</body>
</html>
