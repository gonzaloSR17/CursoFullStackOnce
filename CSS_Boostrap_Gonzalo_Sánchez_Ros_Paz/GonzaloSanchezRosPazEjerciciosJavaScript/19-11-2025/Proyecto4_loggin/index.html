<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body class="py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-6">
                <div class="card mb-4">
                    <div class="card-header bg-primary">
                        <h1 class="text-white">Registro de Usuario</h1>
                    </div>
                    <div class="card-body">
                        <form action="" id="formRegistro">
                            <label for="" class="form-label"> Usuario</label>
                            <input type="text" id="user-register" class="form-control mb-3" required>
                            <label for="" class="form-label"> Contraseña</label>
                            <input type="password" id="pass-register" class="form-control mb-3" required>
                            <div id="mensajeRegistro" class="alert alert-success p-4 d-none">ATENCION </div>
                            <button class="btn btn-primary w-100" id="btn-register" type="submit">Registrarse</button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-success">
                        <h1 class="text-white">Inicio de sesión</h1>
                    </div>
                    <div class="card-body">
                        <form action="" id="formLoggin">
                            <label for="" class="form-label"> Usuario</label>
                            <input type="text" id="user-loggin" class="form-control mb-3" required>
                            <label for="" class="form-label"> Contraseña</label>
                            <input type="password" id="pass-login" class="form-control mb-3" required>
                            <div id="mensajeError" class="alert alert-success p-4 d-none">ATENCION </div>
                            <button class="btn btn-success w-100" type="submit">Iniciar Sesion</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
