<!-- Generador de números aleatorios (nivel medio)

Crea un generador con:

Un botón “Generar número”.

Debe mostrar un número entre 1 y 100.

Si el número generado es mayor a 50 → mostrar alerta verde.

Si es menor o igual a 50 → mostrar alerta roja.

Cada número generado debe añadirse a una lista debajo.

Extra (opcional para nota más alta):

Guardar los números generados en localStorage. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<style>
    body {
        background: linear-gradient(to right, pink, blue);
        height: 200px;
    }
</style>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-10 col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h1 class="card-title text-center shadow-sm">Generador de Numeros</h1>
                    </div>
                    <div class="card-body p-4">
                        <h6 class="text-center mb-4">Pulsa el boton para generar un número</h6>
                        <div class="row">
                            <div class="col-6">
                                <button onclick="numeroRamdon()" id="btnGenerator"
                                    class="btn btn-outline-primary w-100">Generar Número</button>
                            </div>
                            <div class="col-6">
                                <button id="btnReset" class="btn btn-outline-danger w-100">Resetear Lista</button>
                            </div>
                            <div class="mb-3">

                            </div>
                            <div class="col-12 bg-dark rounded">
                                <h1 id="idnumber" class="text-center text-success fw-bold">0</h1>
                            </div>
                            <table id="numberList" class="d-none table-hover table-bordered table-striped mt-3">
                                <thead class="bg-dark text-white text-center">
                                    <tr>
                                        <th>Números</th>
                                    </tr>
                                </thead>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
