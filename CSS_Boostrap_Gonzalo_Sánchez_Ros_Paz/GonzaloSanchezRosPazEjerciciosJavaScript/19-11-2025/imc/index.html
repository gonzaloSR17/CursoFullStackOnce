<!-- Una bascula en donde ponemos una monedas y que calcule su peso yimc -->
<!-- Si la moneda no es de 100 centimos sale mensaje de error que a los 10 segundos de error -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="py-4 bg-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-9">
                <div class="card shadow-sm mt-5">
                    <div class="card-header bg-success">
                        <h1 class="text-white">Báscula</h1>
                    </div>
                    <div class="card-body mt-4">
                        <form action="" id="imc_moneda">
                            <div class="row">
                                <div class="col-4">
                                    <label for="" class="form-label">Tipo de Moneda</label>
                                    <select name="" class="form-select" id="moneda">
                                        <option value="10">10 Centimos</option>
                                        <option value="50">50 Centimos</option>
                                        <option value="100">100 Centimos</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <label for="" class="form-label">Peso (kg)</label>
                                    <input type="number" id="peso" class="form-control">
                                </div>
                                <div class="col-4">
                                    <label for="" class="form-label">Altura</label>
                                    <input type="text" id="altura" class="form-control">
                                </div>
                                <div class="col-12">
                                    <div id="caja-mensaje" class="d-none mt-4 alert">

                                    </div>
                                </div>
                                <div class="col-12 d-flex justify-content-center mt-2 gap-3">
                                    <button type="reset" class="btn btn-danger w-100">Resetear</button>
                                    <button type="submit" class="btn btn-primary w-100">Calcular...</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
