<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    p ~ span {
        color: red;
    }
</style>

<body>

    <!-- Selectores der hermanos generales -->

    <span>Este span no es rojo.</span>
    <p>Aquí hay un párrafo.</p>
    <code>Aquí hay algo de código.</code>
    <span>Aquí hay un span. Es rojo porque va precedido de un párrafo y ambos comparten
        el mismo padre.</span>


</body>

</html>
