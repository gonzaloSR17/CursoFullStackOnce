<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrupacion de selectores</title>
</head>
<style>

    h1, h2, h3 {
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
</style>
<body>
<!--  Crea un selector agrupado que aplique la misma tipografia (font-family: Arial) a los elementosh1, h2 y h3 -->
    
<h1>Prueba de cabecero 1</h1>

<h2>Prueba de cabecero 2</h2>

<h3>Prueba de cabecero 3</h3>
</body>
</html>
