<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     div#contenido-principal span.etiqueta {
        color: orange;
     }
</style>
<body>

    <!-- Crea un selector que aplique color naranja
    a los elementos span con clase .etiqueta que estene dentro
    de un div con id contenido-principal -->



    <div id="contenido-principal">
        <span class="etiqueta">
            <p>Jesus es tonto</p>
        </span>
    </div>

    <div class="contenido-principal">
        <span>
            <p>Jesus es super tonto</p>
        </span>
    </div>
</body>
</html>
