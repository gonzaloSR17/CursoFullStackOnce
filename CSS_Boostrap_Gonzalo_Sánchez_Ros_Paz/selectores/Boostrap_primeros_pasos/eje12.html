<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios selectores intermedios</title>
</head>
<style>
    h2 + p {
        font-size: 19px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
</style>
<body>

    <!-- Selector de hermano adyecente (+) -->
<!-- 
    Crea un selector que aplique un margen superior de 15px solo a los parrafos
    que aparecen inmediatamente despues de un titulo h2 -->

    <h2>Abajo se cambiara de color el parrafo por que viene despues de un encabezado</h2>

    <p>Este parrafo viene inmediatamente despues del h2</p>

    <p>Pero este no</p>
</body>
</html>
