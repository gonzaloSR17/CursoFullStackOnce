<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* * Todas las tarjetas excepto la ultima tendra unpequeño indicador */
    /* .galeria .tarjeta:not(:last-child)::after { */

    input:not([type="submit"]) {
        border-color: green;
        border-style: solid;
    }
</style>
<body>
    <!-- Crea un selector que aplique un borde verde a todos los inputs del formulario
    EXCEPTO aquellos que tenga el atributo type=submit -->


    <h1>FORMULARIO DEL ABURRIMIENTO</h1>

    <form action="">
        <fieldset>
            <legend>Rellena este formulario aburrido</legend>
            <label for="name">Nombre Usuario</label> <br>
            <input type="text" name="text" id="nameid"> <br>
            <label for="edad">Edad</label> <br>
            <input type="range" name="range" id="range"> <br>
            <label for="email"></label>
            <input type="email" name="email" id="email"> <br>
            <label for="detalles">dale a enviar</label><br>
            <input type="submit" value="evialo"><br>
        </fieldset>
    </form>
</body>
</html>
